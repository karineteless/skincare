<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F1F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16121C" media="(prefers-color-scheme: dark)">
<meta name="description" content="Rotina de skincare, cabelo e estoque de cosméticos">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nécessaire">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Nécessaire</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: coluna única de "frascos" (cartões de etapa) com navegação inferior no celular e superior no desktop */
:root{
  --bg:#F3F1F5; --surface:#FFFFFF; --sunk:#EAE6EF; --ink:#241D30; --muted:#6B6379; --line:#DCD5E3;
  --accent:#9E2F5D; --accent-soft:#F5E2EA; --on-accent:#FFFFFF;
  --ok:#2C7656; --ok-soft:#DFF0E6; --warn:#8F5600; --warn-soft:#FAEBCF; --bad:#B0232D; --bad-soft:#FADFE1;
  --hair:#2B6698; --hair-soft:#DFEAF5; --gold:#866510; --gold-soft:#F4EBCF; --yellow:#E2A50B;
  --shadow:0 1px 2px rgba(36,29,48,.06),0 4px 14px rgba(36,29,48,.05);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16121C; --surface:#211B2A; --sunk:#2A2335; --ink:#EEE8F3; --muted:#A79EB5; --line:#3A3147;
  --accent:#E57EA9; --accent-soft:#3E2433; --on-accent:#1E1018;
  --ok:#6FC79C; --ok-soft:#1D3328; --warn:#E8B45C; --warn-soft:#3A2D16; --bad:#F2858C; --bad-soft:#3E1F23;
  --hair:#7FB4E6; --hair-soft:#1C2C3D; --gold:#DDBB5E; --gold-soft:#352E18; --yellow:#EBC04A;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#16121C; --surface:#211B2A; --sunk:#2A2335; --ink:#EEE8F3; --muted:#A79EB5; --line:#3A3147;
  --accent:#E57EA9; --accent-soft:#3E2433; --on-accent:#1E1018;
  --ok:#6FC79C; --ok-soft:#1D3328; --warn:#E8B45C; --warn-soft:#3A2D16; --bad:#F2858C; --bad-soft:#3E1F23;
  --hair:#7FB4E6; --hair-soft:#1C2C3D; --gold:#DDBB5E; --gold-soft:#352E18; --yellow:#EBC04A;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 110px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px 14px}
.brand{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:-.02em;font-variation-settings:"opsz" 96}
.brand small{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
.topnav{display:none;gap:4px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav a,.topnav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:10px;color:var(--muted);text-decoration:none;font-size:12px;font-weight:600}
.nav a svg{width:22px;height:22px}
.nav a[aria-current="page"],.topnav a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
@media (min-width:820px){.nav{display:none}.topnav{display:flex}.topnav a{flex-direction:row;padding:8px 12px;font-size:14px}.topnav a svg{width:18px;height:18px}.wrap{padding-block:16px 48px}}
h2{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.01em;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:16px;margin:0}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.section{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:5px 9px;font-size:13px;border-radius:8px}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:10px;display:inline-grid;place-items:center;font-size:18px;line-height:1}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.hair{background:var(--hair-soft);color:var(--hair)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
button.pill{border:0;cursor:pointer;font-family:inherit}
.val{font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:.04em;padding:1px 5px;border:1px solid currentColor;border-radius:4px;opacity:.9;white-space:nowrap}
.val.bad{color:var(--bad)} .val.warn{color:var(--warn)} .val.ok{color:var(--muted)}
.banner{border-radius:12px;padding:10px 12px;font-size:13.5px;background:var(--sunk);color:var(--muted)}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}

/* Dia */
.daynav{display:flex;align-items:center;gap:8px}
.daynav .lbl{flex:1;min-width:0;text-align:center}
.daynav .lbl b{display:block;font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.daynav .lbl span{font-size:13px;color:var(--muted)}
.ctx{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;margin-top:10px}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 4px;background:var(--surface)}
.switch i{width:30px;height:18px;border-radius:999px;background:var(--sunk);position:relative;transition:background .15s}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:transform .15s}
.switch[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
.switch[aria-pressed="true"] i{background:var(--accent-soft)}
.switch[aria-pressed="true"] i::after{transform:translateX(12px);background:var(--accent)}
.period{display:flex;flex-direction:column;gap:8px}
.period-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 2px 0}
.period-h h3{display:flex;align-items:center;gap:8px}
.prog{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.prog.done{color:var(--ok)}
.step{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.step.done{border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
.step.missing{border-style:dashed;border-color:var(--warn)}
.step-h{display:flex;align-items:flex-start;gap:10px}
.ord{font-family:var(--f-mono);font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:3px 6px;margin-top:2px}
.step-h .t{flex:1;min-width:0}
.step-h .t b{font-weight:700;font-size:15.5px}
.step-h .t small{display:block;color:var(--muted);font-size:12.5px}
.state{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;margin-top:3px}
.state.ok{color:var(--ok)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 10px;text-align:left;display:flex;flex-direction:column;gap:3px;max-width:100%;min-width:0}
.opt .pn{font-weight:600;font-size:13.5px;line-height:1.25}
.opt .pm{font-size:11.5px;color:var(--muted);display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.opt.sel{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.opt.sel .pm{color:inherit;opacity:.85}
.opt.sel .val{color:inherit}
.opt.closed{opacity:.8}
.opt.skip{justify-content:center;font-weight:600;font-size:13px;color:var(--muted);border-style:dashed;background:transparent}
.opt.skip.sel{background:var(--sunk);color:var(--ink);border-style:solid;border-color:var(--muted)}
.opt.more{justify-content:center;font-weight:700;font-size:13px;color:var(--accent);background:transparent;border-color:transparent}
.step.linked{background:var(--sunk);border-style:dotted}
.linkinfo{font-size:13.5px;color:var(--muted)}
.linkinfo b{color:var(--ink)}
.miss{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--warn);background:var(--warn-soft);border-radius:10px;padding:7px 10px}
/* Cabelo */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{border-radius:9px;border:1px solid var(--line);padding:5px 2px;text-align:center;font-size:11px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;gap:2px;align-items:center;min-height:50px}
.wd.prio{border-color:var(--hair);border-style:dashed}
.wd.today{outline:2px solid var(--ink);outline-offset:1px}
.wd.wash{background:var(--hair);color:#fff;border-color:var(--hair)}
.wd.cow{background:var(--hair-soft);color:var(--hair)}
.wd em{font-style:normal;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.04em}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.metric{background:var(--sunk);border-radius:10px;padding:8px 10px;min-width:0}
.metric span{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.metric b{font-size:14.5px}
.metric.bad b{color:var(--bad)} .metric.ok b{color:var(--ok)} .metric.warn b{color:var(--warn)}
.reco{border-left:3px solid var(--hair);padding:4px 0 4px 10px;font-size:14px}
.reco b{color:var(--hair)}
.tog{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13.5px}
.tog[aria-pressed="true"]{background:var(--hair);border-color:var(--hair);color:#fff}
/* Estoque */
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px;overflow-x:auto}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 12px;font-weight:600;font-size:13.5px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{font-family:var(--f-display);font-size:24px;font-weight:700;display:block;line-height:1.1}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.stat.bad b{color:var(--bad)} .stat.warn b{color:var(--warn)}
.group{display:flex;flex-direction:column;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.group-h{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:var(--sunk);font-weight:700;font-size:13px}
.prow{display:flex;flex-direction:column;align-items:stretch;gap:7px;padding:10px 12px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;width:100%}
.prow:first-of-type{border-top:0}
.prow:hover{background:var(--bg)}
.prow-top{display:flex;align-items:center;gap:10px}
.prow .pt{flex:1;min-width:0}
.vrow{display:flex;align-items:center;gap:10px}
.vbar{flex:1;height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.vbar i{display:block;height:100%;border-radius:inherit}
.vbar.ok i{background:var(--ok)} .vbar.warn i{background:var(--yellow)} .vbar.bad i{background:var(--bad)}
.vtxt{font-size:11.5px;color:var(--muted);white-space:nowrap;min-width:9.5em;text-align:right}
.vtxt.bad{color:var(--bad);font-weight:600} .vtxt.warn{color:var(--warn);font-weight:600}
.prow .pt small{display:block;font-size:12px;color:var(--muted)}
.prow .pt b{font-weight:600;font-size:14px}
.prow .pr{display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.prow.gone{opacity:.55}
.shop li{padding:6px 0;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.shop li:first-child{border-top:0}
.shop{list-style:none;margin:0;padding:0}
/* Rotina */
.vers{display:flex;flex-direction:column;gap:6px}
.ver{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;width:100%}
.ver[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.ver .vt{flex:1;min-width:0}
.ver .vt small{display:block;color:var(--muted);font-size:12.5px}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table.grid{border-collapse:collapse;width:100%;font-size:13px}
table.grid th,table.grid td{padding:8px 2px;border-top:1px solid var(--line);text-align:center;vertical-align:middle}
table.grid thead th{border-top:0;font-family:var(--f-mono);font-size:11px;color:var(--muted);font-weight:600}
table.grid th.s,table.grid td.s{text-align:left;padding-left:10px;padding-right:4px;min-width:120px}
@media (max-width:480px){table.grid thead th:not(.s){font-size:0}table.grid thead th:not(.s)::after{content:attr(data-l);font-size:11px}}
table.grid td.s b{display:block;font-size:13.5px}
table.grid td.s small{display:block;color:var(--muted);font-size:11.5px;line-height:1.35}
.cell{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:7px;font-family:var(--f-mono);font-size:11px;font-weight:600}
.c0{background:var(--accent-soft);color:var(--accent)} .c1{background:var(--hair-soft);color:var(--hair)} .c2{background:var(--gold-soft);color:var(--gold)} .c3{background:var(--ok-soft);color:var(--ok)}
.cnone{color:var(--line)}
/* Histórico */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .hd{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:center;padding:4px 0;font-weight:600}
.day{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:62px;padding:5px;display:flex;flex-direction:column;gap:4px;text-align:left}
.day.out{visibility:hidden}
.day.today{border-color:var(--ink)}
.day .n{font-family:var(--f-mono);font-size:12px;font-weight:600}
.marks{display:flex;flex-wrap:wrap;gap:3px}
.mk{width:8px;height:8px;border-radius:50%;background:var(--sunk)}
.mk.dd{background:var(--accent)} .mk.dp{background:color-mix(in srgb,var(--accent) 35%,transparent)}
.mk.nd{background:var(--ink)} .mk.np{background:color-mix(in srgb,var(--ink) 30%,transparent)}
.mk.hw{background:var(--hair)} .mk.hc{background:var(--hair-soft);box-shadow:inset 0 0 0 1.5px var(--hair)}
.mk.ex{background:var(--gold)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;gap:5px;align-items:center}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
/* Modal */
.modal{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(20,14,28,.45)}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:820px){.modal{align-items:center}.sheet{border-radius:18px;max-height:88%}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:-16px;background:var(--bg);padding-block:4px;z-index:2}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .full{grid-column:1/-1}
@media (max-width:480px){.form{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea,.inp{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 10px;font-size:14.5px;color:var(--ink);font-weight:400;width:100%;min-width:0}
label.chk{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:500}
.edstep{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.edrule{background:var(--sunk);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:8px}
.days{display:flex;gap:4px;flex-wrap:wrap}
.dchip{width:34px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:11.5px;font-weight:700;font-family:var(--f-mono)}
.dchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.dchip.taken{opacity:.35}
.catchip{display:inline-flex;gap:4px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 10px;font-size:12.5px;font-weight:600}
.catchip button{border:0;background:var(--sunk);border-radius:50%;width:20px;height:20px;font-size:12px;line-height:1}

<div class="wrap">
  <header class="top">
    <div class="brand">Nécessaire<small>Skincare · cabelo · estoque</small></div>
    <nav class="topnav" id="topnav"></nav>
  </header>
  <main id="main"><div class="empty"><b>Abrindo seu nécessaire…</b>Carregando produtos e rotina.</div></main>
</div>
<nav class="nav" id="nav"></nav>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>

<script>
(() => {
'use strict';
/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o ?? null));
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const toD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d||1, 12); };
const hoje = () => iso(new Date());
const addDays = (s,n) => { const d = toD(s); d.setDate(d.getDate()+n); return iso(d); };
const dow = s => toD(s).getDay();
const diff = (a,b) => Math.round((toD(b)-toD(a))/864e5);
const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const DIAS = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const DC = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const DL = ['D','S','T','Q','Q','S','S'];
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const fmtCurto = s => { const d = toD(s); return pad(d.getDate())+'/'+pad(d.getMonth()+1); };
const fmtLongo = s => { const d = toD(s); return d.getDate()+' de '+MESES[d.getMonth()]+' de '+d.getFullYear(); };
const diasTxt = n => n === 0 ? 'hoje' : n === 1 ? 'ontem' : 'há '+n+' dias';
const listaDias = ds => ds.length === 7 ? 'Todos os dias' : ds.slice().sort().map(d => DC[d]).join(', ');
const AREAS = ['Rosto','Olhos','Pescoço e colo'];
const REGIOES = ['Rosto','Cabelo','Corpo'];
/* Ordem de uso no Estoque. Tipos fora destas listas vêm depois, em ordem alfabética. */
const ORDEM_USO = {
  Rosto: ['Água Micelar','Sabonete Líquido','Toner','Hidratante Aquoso','Sérum','Retinol Olhos','Hidratante Olhos','Hidratante Comum','Hidratante Intenso','Tretinoína','Esfoliação Química','Tratamento Facial','Retinol / Retinal','Protetor Solar Facial Sem Cor','Protetor Solar Facial Com Cor','Sleeping Mask'],
  Cabelo: ['Shampoo Detox','Shampoo','Acidificante','Condicionador','Máscara','Booster de Tratamento','Óleo Finalizador','Creme de Pentear','Gelatina Finalizadora'],
  Corpo: ['Sabonete Líquido Esfoliante','Óleo Corporal','Hidratante Corporal','Protetor Solar Corporal','Repelente']
};
function ordemCat(cat, regiao){
  const ri = Math.max(0, REGIOES.indexOf(regiao)), l = ORDEM_USO[regiao] || [], i = l.indexOf(cat);
  return [ri, i < 0 ? 999 : i, norm(cat)];
}
const cmpOrdem = (a,b) => a[0]-b[0] || a[1]-b[1] || (a[2] < b[2] ? -1 : a[2] > b[2] ? 1 : 0);

/* ---------- estado ---------- */
const S = {
  produtos:{}, rotinas:{}, diario:{}, config:{},
  loaded:{}, slow:false, local:false, err:null,
  view:'hoje', dia:hoje(), mes:hoje().slice(0,7),
  reg:'Rosto', busca:'', acabados:false, verSel:null,
  hairDraft:{}, extraForm:false, expand:new Set()
};
const COLS = ['produtos','rotinas','diario','config'];
const cfg = () => S.config.geral || {};
const extrasTipos = () => cfg().extras || ['Máscara de tecido','Máscara de argila','Máscara hidratante','Limpeza de pele','Esfoliação física'];

/* ---------- armazenamento ---------- */
const LKEY = 'necessaire.local.v1';
const pending = new Map(), inflight = new Set();
const Store = {
  db:null,
  async init(){
    let db = null;
    try { db = (window.claude && window.claude.use) ? await window.claude.use('db') : null; } catch(e) { db = null; }
    if (db) {
      this.db = db;
      COLS.forEach(c => this.listen(c));
      setTimeout(() => { if (!COLS.every(c => S.loaded[c])) { S.slow = true; render(); } }, 10000);
    } else {
      S.local = true;
      let tem = false;
      try { const raw = localStorage.getItem(LKEY); if (raw) { Object.assign(S, JSON.parse(raw)); tem = true; } } catch(e) {}
      if (!tem) {
        try { const r = await fetch('dados-iniciais.json', {cache:'no-store'}); if (r.ok) { const j = await r.json(); ['produtos','rotinas','config'].forEach(c => S[c] = j[c] || {}); this.saveLocal(); } } catch(e) {}
      }
      COLS.forEach(c => S.loaded[c] = true);
      render();
    }
  },
  listen(col){
    let q = this.db.collection(col);
    if (col === 'diario') q = q.orderBy('data','desc').limit(1000);
    q.onSnapshot(snap => {
      const m = {};
      snap.docs.forEach(d => { m[d.id] = d.data(); });
      for (const [k,job] of pending) if (job.col === col) { if (job.data === null) delete m[job.id]; else m[job.id] = job.data; }
      S[col] = m; S.loaded[col] = true;
      if (!snap.metadata.fromCache) S.slow = false;
      render();
    }, err => { S.err = err.code; S.loaded[col] = true; render(); });
  },
  write(col, id, data){
    const m = Object.assign({}, S[col]);
    if (data === null) delete m[id]; else m[id] = data;
    S[col] = m;
    render();
    if (S.local) { this.saveLocal(); return; }
    pending.set(col+'/'+id, {col, id, data});
    pump(col+'/'+id);
  },
  saveLocal(){
    try { localStorage.setItem(LKEY, JSON.stringify({produtos:S.produtos, rotinas:S.rotinas, diario:S.diario, config:S.config})); } catch(e) {}
  }
};
async function pump(key){
  if (inflight.has(key)) return;
  const job = pending.get(key); if (!job) return;
  pending.delete(key); inflight.add(key);
  const run = () => { const ref = Store.db.collection(job.col).doc(job.id); return job.data === null ? ref.delete() : ref.set(job.data); };
  try { await run(); }
  catch(e) {
    if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 600 + Math.random()*900)); try { await run(); } catch(e2) { toast('Não salvou. Verifique a conexão e tente de novo.'); } }
    else if (e && e.code === 'quota_exceeded') toast('O banco do app está cheio. Exclua registros antigos.');
    else toast('Não foi possível salvar esta alteração.');
  } finally { inflight.delete(key); if (pending.has(key)) pump(key); }
}

/* ---------- produtos ---------- */
const prodList = () => Object.entries(S.produtos).map(([id,p]) => Object.assign({id}, p));
const diasVal = p => p.val ? diff(hoje(), p.val) : 9999;
const vencido = p => p.val && diasVal(p) < 0;
const addMonths = (s,n) => { const d = toD(s), dia = d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n); d.setDate(Math.min(dia, new Date(d.getFullYear(), d.getMonth()+1, 0).getDate())); return iso(d); };
const valClass = p => !p.val ? 'ok' : p.val < hoje() ? 'bad' : p.val <= addMonths(hoje(), 3) ? 'warn' : 'ok';
function prazoTxt(p){
  if (!p.val) return 'sem validade';
  const n = diff(hoje(), p.val), m = Math.floor(Math.abs(n)/30.44);
  const t = m >= 1 ? m+(m > 1 ? ' meses' : ' mês') : Math.abs(n)+(Math.abs(n) === 1 ? ' dia' : ' dias');
  return n < 0 ? 'vencido há '+t : n === 0 ? 'vence hoje' : 'vence em '+t;
}
/* barra: tempo restante numa escala de 24 meses; vencido = barra cheia vermelha */
function valBar(p){
  if (!p.val) return '';
  const n = diff(hoje(), p.val), c = valClass(p);
  const pct = n < 0 ? 100 : Math.max(4, Math.min(100, n/730*100));
  return `<div class="vrow"><div class="vbar ${c}" role="img" aria-label="${prazoTxt(p)}"><i style="width:${pct.toFixed(1)}%"></i></div><span class="vtxt ${c}">${prazoTxt(p)}</span></div>`;
}
const valTxt = p => p.val ? 'VAL '+p.val.slice(5,7)+'/'+p.val.slice(2,4) : 'sem val.';
const valBadge = p => `<span class="val ${valClass(p)}" title="${p.val ? 'Validade '+fmtCurto(p.val)+'/'+p.val.slice(0,4) : ''}">${valTxt(p)}</span>`;
const pNome = p => (p.marca ? p.marca+' — ' : '') + p.nome;
const PRIO = {1:'Preferir', 0:'Normal', '-1':'Deixar por último'};
const HORARIO = {'':'Qualquer horário', manha:'Só diurno', noite:'Só noturno'};
/* Opções de uma etapa: respeita horário do produto, kit viagem e só mostra
   fechados quando a categoria não tem nenhum aberto. Ordem: prioridade da
   Karine → não vencido → vence primeiro. */
function prodsFor(cats, viagem, periodo){
  const set = new Set(cats||[]);
  let ps = prodList().filter(p => set.has(p.cat) && !p.acabou && (p.qtd ?? 1) > 0 && (viagem || !p.viagem) && (!periodo || !p.periodo || p.periodo === periodo));
  const abertas = new Set(ps.filter(p => p.status !== 'Fechado').map(p => p.cat));
  ps = ps.filter(p => p.status !== 'Fechado' || !abertas.has(p.cat));
  ps.sort((a,b) => ((b.prio||0)-(a.prio||0)) || (vencido(a)-vencido(b)) || ((a.status==='Fechado')-(b.status==='Fechado')) || (a.val||'9999').localeCompare(b.val||'9999') || pNome(a).localeCompare(pNome(b)));
  return ps;
}
const categorias = () => {
  const s = new Set(prodList().map(p => p.cat).filter(Boolean));
  Object.values(S.rotinas).forEach(v => (v.periodos||[]).forEach(p => p.etapas.forEach(e => (e.regras||[]).forEach(r => (r.cats||[]).forEach(c => s.add(c))))));
  return [...s].sort((a,b) => a.localeCompare(b));
};

/* ---------- rotinas ---------- */
const todasRotinas = () => Object.entries(S.rotinas).map(([id,v]) => Object.assign({id}, v));
const versoes = () => todasRotinas().filter(v => !v.fim).sort((a,b) => a.inicio.localeCompare(b.inicio));
const ajustes = () => todasRotinas().filter(v => v.fim).sort((a,b) => a.inicio.localeCompare(b.inicio));
function basePara(d){ const vs = versoes(); if (!vs.length) return null; let v = vs[0]; for (const x of vs) if (x.inicio <= d) v = x; return v; }
/* ajuste temporário vale entre inicio e fim e tem precedência sobre a versão base */
function ajustePara(d){ return ajustes().filter(a => a.inicio <= d && d <= a.fim).sort((a,b) => b.inicio.localeCompare(a.inicio) || String(b.criadoEm||'').localeCompare(String(a.criadoEm||'')))[0] || null; }
function versaoPara(d){ return ajustePara(d) || basePara(d); }
/* etapa que repete o produto de outra etapa do mesmo período (ex.: pescoço = hidratante do rosto) */
function linkSrc(p, e){ return e.regra && e.regra.igual ? p.etapas.find(x => x.id === e.regra.igual) || null : null; }
function syncLinks(doc, d){
  etapasDoDia(versaoPara(d), d).forEach(p => p.etapas.forEach(e => {
    const src = linkSrc(p, e); if (!src) return;
    const k = p.id+':'+e.id, s = doc.pele[p.id+':'+src.id];
    if (s) doc.pele[k] = Object.assign({}, s, {etapa:e.nome, rotulo:e.regra.rotulo||'', ord:e.ord, area:e.area||'', auto:true});
    else if (doc.pele[k] && doc.pele[k].auto) delete doc.pele[k];
  }));
}
function etapasDoDia(v, d){
  if (!v) return [];
  const wd = dow(d);
  return (v.periodos||[]).map(p => ({
    id:p.id, nome:p.nome, sigla:p.sigla,
    etapas: p.etapas.map((e,i) => { if (e.pausada) return null; const r = (e.regras||[]).find(r => (r.dias||[]).includes(wd)); return r ? Object.assign({}, e, {regra:r, ord:(p.sigla||'')+(i+1)}) : null; }).filter(Boolean)
  }));
}
function faltas(v){
  const out = new Map();
  if (!v) return [];
  (v.periodos||[]).forEach(p => p.etapas.forEach((e,i) => !e.pausada && (e.regras||[]).forEach(r => {
    if (!(r.dias||[]).length || !(r.cats||[]).length || r.igual) return;
    const ps = prodsFor(r.cats, false, p.id);
    if (!ps.length) {
      const key = r.cats.join(' / ');
      if (!out.has(key)) out.set(key, {cats:r.cats, onde:[]});
      out.get(key).onde.push((p.sigla||'')+(i+1)+' '+e.nome+(r.rotulo ? ' · '+r.rotulo : ''));
    }
  })));
  return [...out.values()];
}

/* ---------- diário ---------- */
function getDia(d){ return S.diario[d] ? clone(S.diario[d]) : {data:d, pele:{}, cabelo:null, extras:[], viagem:false}; }
function saveDia(doc){
  doc.data = S.dia === doc.data ? doc.data : doc.data;
  const vazio = !Object.keys(doc.pele||{}).length && !doc.cabelo && !(doc.extras||[]).length && !doc.viagem;
  Store.write('diario', doc.data, vazio ? null : doc);
}

/* ---------- cabelo ---------- */
function hairCfg(d){ const v = versaoPara(d); return Object.assign({minSemana:3, prioridade:[0,2,4], acidDias:14, detoxSemana:1, cowashConta:false, nota:''}, v && v.cabelo); }
function hairEntries(){ return Object.values(S.diario).filter(x => x.cabelo).map(x => Object.assign({data:x.data}, x.cabelo)).sort((a,b) => a.data.localeCompare(b.data)); }
function hairStatus(day){
  const c = hairCfg(day);
  const all = hairEntries();
  const conta = e => e.tipo === 'lavagem' || (c.cowashConta && e.tipo === 'cowash');
  const before = all.filter(e => e.data < day);
  const weekStart = addDays(day, -dow(day));
  const semana = all.filter(e => e.data >= weekStart && e.data <= addDays(weekStart,6));
  const semanaAntes = before.filter(e => e.data >= weekStart);
  const lavSemana = semanaAntes.filter(conta).length;
  const detoxSemana = semanaAntes.filter(e => e.detox).length;
  const lastWash = before.filter(e => e.tipo === 'lavagem' || e.tipo === 'cowash').at(-1);
  const lastLav = before.filter(e => e.tipo === 'lavagem').at(-1);
  const lastAcid = all.filter(e => e.acid && e.data < day).at(-1);
  const acidDue = lastAcid ? addDays(lastAcid.data, c.acidDias) : null;
  const restam = 7 - dow(day);
  const falta = Math.max(0, c.minSemana - lavSemana);
  let lavar;
  if (falta > 0 && falta >= restam) lavar = 'precisa';
  else if (falta === 0) lavar = 'meta';
  else if ((c.prioridade||[]).includes(dow(day))) lavar = 'prioridade';
  else lavar = 'opcional';
  const sug = {detox:false, acid:false};
  if ((!acidDue || acidDue <= day) && !(lastLav && lastLav.acid)) sug.acid = true;
  if (detoxSemana < c.detoxSemana && !(lastLav && lastLav.detox)) sug.detox = true;
  if (sug.acid && sug.detox && falta > 1 && restam > 2) sug.detox = false; // espaça: acidifica agora, detox numa próxima
  return {c, lavSemana, detoxSemana, lastWash, lastLav, lastAcid, acidDue, restam, falta, lavar, sug, weekStart, semana};
}

/* ---------- UI genérica ---------- */
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }
const ICON = {
  hoje:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 3h6v3l1.5 2.2V20a1 1 0 0 1-1 1h-7a1 1 0 0 1-1-1V8.2L9 6z"/><path d="M8 12h8"/></svg>',
  estoque:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 8h16v12H4z"/><path d="M7 8V5h10v3M10 12h4"/></svg>',
  rotina:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2"/><circle cx="4.5" cy="12" r="1.2"/><circle cx="4.5" cy="18" r="1.2"/></svg>',
  historico:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>'
};
const VIEWS = [['hoje','Hoje'],['estoque','Estoque'],['rotina','Rotina'],['historico','Histórico']];
function renderNav(){
  const html = VIEWS.map(([k,l]) => `<a href="#${k}" ${S.view===k?'aria-current="page"':''}>${ICON[k]}<span>${l}</span></a>`).join('');
  $('#nav').innerHTML = html; $('#topnav').innerHTML = html;
}
function render(){
  const ae = document.activeElement, aid = ae && ae.id, sel = ae && ae.selectionStart;
  renderNav();
  const ready = COLS.every(c => S.loaded[c]);
  let html;
  if (!ready) html = `<div class="empty"><b>${S.slow ? 'Ainda conectando…' : 'Abrindo seu nécessaire…'}</b>${S.slow ? 'Os dados não responderam. Verifique a internet; o app tenta de novo sozinho.' : 'Carregando produtos e rotina.'}</div>`;
  else html = (S.local ? `<div class="banner" style="margin-bottom:12px">Seus dados ficam salvos neste aparelho. Exporte um backup de vez em quando (aba Rotina, no fim da página).</div>` : '')
    + (S.err ? `<div class="banner bad" style="margin-bottom:12px">Sem acesso aos dados agora (${h(S.err)}).</div>` : '')
    + ({hoje:vHoje, estoque:vEstoque, rotina:vRotina, historico:vHistorico}[S.view] || vHoje)();
  $('#main').innerHTML = html;
  if (aid) { const el = document.getElementById(aid); if (el && !el.closest('#modal')) { el.focus(); try { if (sel != null) el.setSelectionRange(sel, sel); } catch(e) {} } }
}

/* ---------- VIEW: Hoje ---------- */
function vHoje(){
  const d = S.dia, v = versaoPara(d), dia = getDia(d), isHoje = d === hoje();
  const rel = diff(hoje(), d);
  const relTxt = rel === 0 ? 'Hoje' : rel === -1 ? 'Ontem' : rel === 1 ? 'Amanhã' : (rel < 0 ? 'há '+(-rel)+' dias' : 'em '+rel+' dias');
  let out = `<div class="card">
    <div class="daynav">
      <button class="iconbtn" data-act="dia" data-n="-1" aria-label="Dia anterior">‹</button>
      <div class="lbl"><b>${DIAS[dow(d)]}</b><span>${fmtLongo(d)} · ${relTxt}</span></div>
      <button class="iconbtn" data-act="dia" data-n="1" aria-label="Próximo dia">›</button>
    </div>
    <div class="ctx">
      ${!isHoje ? `<button class="btn sm" data-act="dia-hoje">Voltar para hoje</button>` : ''}
      ${v && v.fim ? `<button class="pill gold" data-act="rot-edit" data-id="${h(v.id)}" title="Editar ajuste">Ajuste temporário: ${h(v.nome)} · até ${fmtCurto(v.fim)} ✎</button>` : v ? `<span class="pill acc">Rotina: ${h(v.nome)} · desde ${fmtCurto(v.inicio)}</span>` : ''}
      ${v && !v.fim ? `<button class="btn sm" data-act="aj-novo">Mudar só por uns dias</button>` : ''}
      <button class="switch" data-act="viagem" aria-pressed="${!!dia.viagem}"><i></i>Viagem</button>
    </div>
  </div>`;
  if (!v) return out + `<div class="empty"><b>Nenhuma rotina cadastrada</b>Crie a primeira na aba Rotina.</div>`;

  /* Pele */
  const periodos = etapasDoDia(v, d);
  const usados = new Set();
  out += `<section class="section"><div class="section-h"><h2>Skincare</h2><span class="small muted">Toque no produto que usou. Toque de novo para desmarcar.</span></div>`;
  periodos.forEach(p => {
    const feitos = p.etapas.filter(e => { const src = linkSrc(p, e); return dia.pele[p.id+':'+e.id] || (src && dia.pele[p.id+':'+src.id]); }).length;
    out += `<div class="period"><div class="period-h"><h3>${h(p.nome)}</h3><span class="prog ${feitos===p.etapas.length && feitos ? 'done':''}">${feitos}/${p.etapas.length}</span></div>`;
    if (!p.etapas.length) out += `<div class="banner">Nenhuma etapa neste dia.</div>`;
    p.etapas.forEach(e => {
      const k = p.id+':'+e.id; usados.add(k);
      const lsrc = linkSrc(p, e);
      if (lsrc) {
        const sr = dia.pele[p.id+':'+lsrc.id];
        out += `<div class="step linked ${sr ? 'done' : ''}">
          <div class="step-h"><span class="ord">${h(e.ord)}</span><div class="t"><b>${h(e.nome)}</b><small>${h([e.regra.rotulo, e.area].filter(Boolean).join(' · '))}</small></div>${sr ? (sr.pulou ? '<span class="state">não usei</span>' : '<span class="state ok">✓ automático</span>') : '<span class="state">segue o '+h(lsrc.ord)+'</span>'}</div>
          <div class="linkinfo">${sr ? (sr.pulou ? `Igual ao ${h(lsrc.ord)}: não usado.` : `Mesmo produto do ${h(lsrc.ord)}: <b>${h(sr.prodNome)}</b>`) : `Usa o mesmo produto do ${h(lsrc.ord)} ${h(lsrc.nome)}. Marque lá.`}</div>
        </div>`;
        return;
      }
      const reg = dia.pele[k];
      const ps = prodsFor(e.regra.cats, dia.viagem, p.id);
      const sugId = ps[0] && ps[0].id;
      const missing = !ps.length;
      let st = '<span class="state">pendente</span>';
      if (reg && reg.pulou) st = '<span class="state">não usei</span>';
      else if (reg) st = '<span class="state ok">✓ feito</span>';
      out += `<div class="step ${reg ? 'done' : ''} ${missing ? 'missing' : ''}">
        <div class="step-h"><span class="ord">${h(e.ord)}</span><div class="t"><b>${h(e.nome)}</b><small>${h([e.regra.rotulo, e.area].filter(Boolean).join(' · '))}</small></div>${st}</div>
        ${missing ? `<div class="miss">Sem produto para ${h(e.regra.cats.join(' / '))} · comprar</div>` : ''}
        <div class="opts">
          ${ps.filter((x,ix) => ix < (S.expand.has(d+'|'+k) ? 999 : 2) || (reg && reg.produto === x.id)).map(x => `<button class="opt ${reg && reg.produto===x.id ? 'sel':''} ${x.status==='Fechado'?'closed':''}" data-act="pick" data-k="${h(k)}" data-p="${h(x.id)}">
              <span class="pn">${h(x.nome)}</span>
              <span class="pm">${h(x.marca||'')} ${valBadge(x)} ${x.status==='Fechado' ? '<span>fechado</span>' : ''} ${x.viagem ? '<span>viagem</span>' : ''} ${x.prio===1 ? '<span>★ preferido</span>' : ''} ${x.id===sugId ? '<b>sugestão</b>' : ''}</span>
            </button>`).join('')}
          ${reg && reg.produto && !ps.some(x => x.id === reg.produto) ? `<button class="opt sel" data-act="pick" data-k="${h(k)}" data-p="${h(reg.produto)}"><span class="pn">${h(reg.prodNome)}</span><span class="pm">registrado</span></button>` : ''}
          <button class="opt skip ${reg && reg.pulou ? 'sel':''}" data-act="pick" data-k="${h(k)}" data-p="__skip">Não usei</button>
          ${ps.length > 2 ? `<button class="opt more" data-act="more" data-k="${h(d+'|'+k)}" aria-expanded="${S.expand.has(d+'|'+k)}">${S.expand.has(d+'|'+k) ? '▴ Recolher' : '▾ Ver todos ('+ps.length+')'}</button>` : ''}
        </div>
      </div>`;
    });
    out += `</div>`;
  });
  const orfaos = Object.entries(dia.pele).filter(([k]) => !usados.has(k));
  if (orfaos.length) out += `<div class="card small"><div class="eyebrow" style="margin-bottom:6px">Outros registros deste dia</div>${orfaos.map(([k,r]) => `<div>${h(r.ord||'')} ${h(r.etapa)}${r.rotulo ? ' · '+h(r.rotulo) : ''}: <b>${r.pulou ? 'não usei' : h(r.prodNome)}</b></div>`).join('')}</div>`;
  out += `</section>`;

  out += vCabelo(d, dia);
  out += vExtras(d, dia);
  return out;
}

function vCabelo(d, dia){
  const st = hairStatus(d), c = st.c, reg = dia.cabelo;
  const draft = S.hairDraft[d] || (reg ? {detox:!!reg.detox, acid:!!reg.acid} : clone(st.sug));
  S.hairDraft[d] = draft;
  const week = [...Array(7)].map((_,i) => {
    const wd = addDays(st.weekStart, i), e = st.semana.find(x => x.data === wd);
    const cls = ['wd', (c.prioridade||[]).includes(i) ? 'prio':'', wd === d ? 'today':'', e ? (e.tipo === 'cowash' ? 'cow' : 'wash') : ''].join(' ');
    const tag = e ? (e.tipo === 'cowash' ? 'CW' : [e.detox ? 'DTX' : '', e.acid ? 'ACD' : ''].filter(Boolean).join('+') || 'LAV') : '';
    return `<div class="${cls}"><span>${DL[i]}</span><em>${toD(wd).getDate()}</em><em>${tag}</em></div>`;
  }).join('');
  const lw = st.lastWash ? diff(st.lastWash.data, d) : null;
  const acidTxt = !st.lastAcid ? 'Sem registro' : (st.acidDue <= d ? (st.acidDue === d ? 'Hoje' : 'Atrasada '+diff(st.acidDue, d)+'d') : fmtCurto(st.acidDue)+' · em '+diff(d, st.acidDue)+'d');
  const acidCls = !st.lastAcid || st.acidDue <= d ? 'warn' : 'ok';
  const reco = {
    precisa: `<b>Lave hoje.</b> Faltam ${st.falta} lavage${st.falta>1?'ns':'m'} e restam ${st.restam} dia${st.restam>1?'s':''} na semana.`,
    prioridade: `<b>Dia prioritário de lavagem.</b> ${st.lavSemana} de ${c.minSemana} feitas nesta semana.`,
    opcional: `Lavagem opcional hoje. ${st.lavSemana} de ${c.minSemana} feitas nesta semana.`,
    meta: `<b>Meta da semana cumprida</b> (${st.lavSemana}/${c.minSemana}). Lave se quiser.`
  }[st.lavar];
  const tipoSug = st.sug.acid && st.sug.detox ? 'shampoo detox + acidificação' : st.sug.acid ? 'acidificação (shampoo + acidificante + condicionador)' : st.sug.detox ? 'shampoo detox' : 'lavagem comum';
  const repete = st.lastLav ? (st.lastLav.detox ? 'detox' : st.lastLav.acid ? 'acidificação' : 'comum') : null;
  let out = `<section class="section"><div class="section-h"><h2>Cabelo</h2><span class="small muted">Semana de domingo a sábado</span></div>
  <div class="card stack">
    <div class="week">${week}</div>
    <div class="metrics">
      <div class="metric ${st.lavSemana >= c.minSemana ? 'ok':''}"><span>Lavagens na semana</span><b class="mono">${st.lavSemana}/${c.minSemana}</b></div>
      <div class="metric"><span>Última lavagem</span><b>${lw == null ? 'Sem registro' : diasTxt(lw)}${st.lastWash && st.lastWash.tipo==='cowash' ? ' (cowash)' : ''}</b></div>
      <div class="metric ${st.detoxSemana >= c.detoxSemana ? 'ok':'warn'}"><span>Detox na semana</span><b>${st.detoxSemana >= c.detoxSemana ? 'Feito' : 'Pendente'}</b></div>
      <div class="metric ${acidCls}"><span>Próxima acidificação</span><b>${acidTxt}</b></div>
    </div>`;
  if (!reg) {
    out += `<div class="reco">${reco}<br>Sugestão de tipo: <b>${tipoSug}</b>.${repete ? ` <span class="muted small">Última foi ${repete}.</span>` : ''}</div>
    <div class="row"><span class="small muted">Esta lavagem inclui:</span>
      <button class="tog" data-act="hair-tog" data-f="detox" aria-pressed="${draft.detox}">Shampoo detox</button>
      <button class="tog" data-act="hair-tog" data-f="acid" aria-pressed="${draft.acid}">Acidificação</button>
    </div>
    <div class="row"><button class="btn primary" data-act="hair-reg" data-t="lavagem">Registrar lavagem</button><button class="btn" data-act="hair-reg" data-t="cowash">Registrar cowash</button></div>`;
  } else {
    const desc = reg.tipo === 'cowash' ? 'Cowash (fora da rotina)' : 'Lavagem' + (reg.detox ? ' · shampoo detox' : '') + (reg.acid ? ' · acidificação' : '') + (!reg.detox && !reg.acid ? ' comum' : '');
    out += `<div class="row between"><span class="pill hair">✓ ${h(desc)}</span><button class="btn sm ghost" data-act="hair-undo">Desfazer</button></div>`;
    if (reg.tipo === 'lavagem') out += `<div class="row"><span class="small muted">Corrigir:</span>
      <button class="tog" data-act="hair-fix" data-f="detox" aria-pressed="${!!reg.detox}">Shampoo detox</button>
      <button class="tog" data-act="hair-fix" data-f="acid" aria-pressed="${!!reg.acid}">Acidificação</button></div>`;
  }
  if (c.nota) out += `<div class="small muted">${h(c.nota)}</div>`;
  out += `</div></section>`;
  return out;
}

function vExtras(d, dia){
  const tipos = extrasTipos();
  const last = {};
  Object.values(S.diario).forEach(x => (x.extras||[]).forEach(e => { if (x.data <= d && (!last[e.tipo] || last[e.tipo] < x.data)) last[e.tipo] = x.data; }));
  let out = `<section class="section"><div class="section-h"><h2>Cuidados extras</h2><span class="small muted">Não entram na rotina, só ficam registrados</span></div><div class="card stack">`;
  if ((dia.extras||[]).length) out += `<div class="extra-list">${dia.extras.map((e,i) => `<span class="xchip">${h(e.tipo)}${e.prodNome ? ' · '+h(e.prodNome) : ''}<button data-act="extra-del" data-i="${i}" aria-label="Remover">×</button></span>`).join('')}</div>`;
  if (S.extraForm) {
    const ps = prodList().filter(p => !p.acabou && p.regiao !== 'Cabelo').sort((a,b) => (a.cat||'').localeCompare(b.cat||'') || pNome(a).localeCompare(pNome(b)));
    const grupos = {}; ps.forEach(p => (grupos[p.cat] = grupos[p.cat] || []).push(p));
    out += `<div class="form">
      <label class="f">Cuidado<select id="ex-tipo">${tipos.map(t => `<option>${h(t)}</option>`).join('')}<option value="__outro">Outro…</option></select></label>
      <label class="f">Novo tipo (se "Outro")<input id="ex-outro" placeholder="ex.: Peeling de diamante"></label>
      <label class="f full">Produto usado (opcional)<select id="ex-prod"><option value="">— nenhum / não lembro —</option>${Object.entries(grupos).map(([g,l]) => `<optgroup label="${h(g)}">${l.map(p => `<option value="${h(p.id)}">${h(pNome(p))}${p.qtd>1 ? ' ('+p.qtd+')' : ''}</option>`).join('')}</optgroup>`).join('')}</select></label>
      <label class="chk full"><input type="checkbox" id="ex-desc"> Descontar 1 unidade do estoque (ex.: máscara de tecido)</label>
    </div>
    <div class="row"><button class="btn primary" data-act="extra-save">Registrar em ${fmtCurto(d)}</button><button class="btn ghost" data-act="extra-cancel">Cancelar</button></div>`;
  } else out += `<div><button class="btn" data-act="extra-open">+ Registrar cuidado extra</button></div>`;
  const ult = tipos.filter(t => last[t]).map(t => `<span class="pill gold">${h(t)}: ${diasTxt(diff(last[t], d))}</span>`);
  if (ult.length) out += `<div class="row">${ult.join('')}</div>`;
  out += `</div></section>`;
  return out;
}

function listaProdutos(){
  const q = norm(S.busca);
  const ps = prodList().filter(p => (S.reg === 'Todos' || p.regiao === S.reg) && (S.acabados ? p.acabou : !p.acabou) && (!q || norm([p.marca,p.nome,p.cat].join(' ')).includes(q)));
  if (!ps.length) return `<div class="empty"><b>Nada por aqui</b>${S.acabados ? 'Nenhum produto marcado como acabado.' : 'Ajuste o filtro ou cadastre um produto.'}</div>`;
  const g = {}, reg = {};
  ps.forEach(p => { const c = p.cat||'Sem categoria'; (g[c] = g[c] || []).push(p); if (!reg[c]) reg[c] = p.regiao; });
  return Object.keys(g).sort((a,b) => cmpOrdem(ordemCat(a, reg[a]), ordemCat(b, reg[b]))).map(cat => {
    const l = g[cat].sort((a,b) => (a.val||'9999').localeCompare(b.val||'9999'));
    return `<div class="group"><div class="group-h"><span>${h(cat)}</span><span class="mono muted">${l.length}</span></div>${l.map(p => `
      <button class="prow ${p.acabou?'gone':''}" data-act="prod-edit" data-id="${h(p.id)}"><div class="prow-top">
        <div class="pt"><small>${h(p.marca||'')}</small><b>${h(p.nome)}</b></div>
        <div class="pr">${p.prio===1 ? '<span class="pill gold">★ preferido</span>' : p.prio===-1 ? '<span class="pill">por último</span>' : ''}${p.periodo ? `<span class="pill hair">${p.periodo==='noite' ? 'só noite' : 'só dia'}</span>` : ''}${p.viagem ? '<span class="pill">viagem</span>' : ''}${(p.qtd??1) > 1 ? `<span class="pill mono">×${p.qtd}</span>` : ''}<span class="pill ${p.status==='Fechado' ? '' : 'acc'}">${h(p.acabou ? 'acabou' : p.status||'Em uso')}</span>${valBadge(p)}</div></div>
        ${p.acabou ? '' : valBar(p)}
      </button>`).join('')}</div>`;
  }).join('');
}

/* ---------- VIEW: Rotina ---------- */
function vRotina(){
  const vs = versoes(), atual = basePara(hoje()), ajs = ajustes();
  if (!vs.length) return `<div class="empty"><b>Nenhuma rotina ainda</b><button class="btn primary" data-act="rot-nova" style="margin-top:10px">Criar rotina</button></div>`;
  const sel = (S.verSel && S.rotinas[S.verSel]) ? Object.assign({id:S.verSel}, S.rotinas[S.verSel]) : atual;
  let out = `<section class="section" style="margin-top:0"><div class="section-h"><h2>Versões da rotina</h2><button class="btn primary sm" data-act="rot-nova">+ Nova versão a partir de uma data</button></div>
  <div class="small muted">Cada versão vale a partir da data de início até a próxima. O que já foi registrado continua no histórico do jeito que foi feito.</div>
  <div class="vers">${vs.slice().reverse().map((v,i,arr) => {
    const prox = vs[vs.indexOf(v)+1];
    const tag = v.id === atual.id ? '<span class="pill ok">em vigor</span>' : v.inicio > hoje() ? '<span class="pill acc">agendada</span>' : '<span class="pill">anterior</span>';
    return `<button class="ver" data-act="rot-sel" data-id="${h(v.id)}" aria-pressed="${v.id===sel.id}"><div class="vt"><b>${h(v.nome)}</b><small class="mono">${fmtCurto(v.inicio)}/${v.inicio.slice(0,4)} → ${prox ? fmtCurto(addDays(prox.inicio,-1))+'/'+addDays(prox.inicio,-1).slice(0,4) : 'atual'}</small></div>${tag}</button>`;
  }).join('')}</div></section>
  <section class="section"><div class="section-h"><h2>Ajustes temporários</h2><button class="btn sm" data-act="aj-novo">+ Ajuste temporário</button></div>
  <div class="small muted">Mudam a rotina só entre duas datas, por exemplo uma semana sem ácidos e retinoides. Depois a rotina normal volta sozinha.</div>
  ${ajs.length ? `<div class="vers">${ajs.slice().reverse().map(a => {
    const tag = a.inicio <= hoje() && hoje() <= a.fim ? '<span class="pill ok">ativo</span>' : a.inicio > hoje() ? '<span class="pill acc">agendado</span>' : '<span class="pill">encerrado</span>';
    return `<button class="ver" data-act="rot-sel" data-id="${h(a.id)}" aria-pressed="${a.id===sel.id}"><div class="vt"><b>${h(a.nome)}</b><small class="mono">${fmtCurto(a.inicio)} → ${fmtCurto(a.fim)}/${a.fim.slice(0,4)}</small></div>${tag}</button>`;
  }).join('')}</div>` : ''}</section>`;

  const ehAj = !!sel.fim;
  out += `<section class="section"><div class="section-h"><h2>${h(sel.nome)}</h2><div class="row"><button class="btn sm" data-act="rot-edit" data-id="${h(sel.id)}">${ehAj ? 'Editar este ajuste' : 'Editar esta versão'}</button>${ehAj || vs.length > 1 ? `<button class="btn sm danger" data-act="rot-del" data-id="${h(sel.id)}" data-confirm="Confirmar exclusão">Excluir</button>` : ''}</div></div>
  ${ehAj ? `<div class="banner warn">Ajuste temporário de ${fmtCurto(sel.inicio)} a ${fmtCurto(sel.fim)}.</div>` : ''}
  ${sel.obs ? `<div class="small muted">${h(sel.obs)}</div>` : ''}`;
  (sel.periodos||[]).forEach(p => {
    out += `<h3 style="margin-top:6px">${h(p.nome)}</h3><div class="tblwrap"><table class="grid"><thead><tr><th class="s">Etapa</th>${DL.map((l,i) => `<th title="${DIAS[i]}" data-l="${l}">${DC[i]}</th>`).join('')}</tr></thead><tbody>`;
    p.etapas.forEach((e,i) => {
      const multi = (e.regras||[]).length > 1;
      const fonte = r => { if (r.igual) { const xi = p.etapas.findIndex(x => x.id === r.igual); if (xi >= 0) return 'mesmo produto da '+(p.sigla||'')+(xi+1); } return (r.cats||[]).join(', ') || '—'; };
      out += `<tr${e.pausada ? ' style="opacity:.5"' : ''}><td class="s"><b><span class="mono muted">${h((p.sigla||'')+(i+1))}</span> ${h(e.nome)}${e.pausada ? ' <span class="pill">pausada</span>' : ''}</b>${(e.regras||[]).map((r,ri) => `<small>${multi ? `<span class="cell c${ri%4}" style="min-width:16px;height:16px;font-size:9.5px">${ri+1}</span> ` : ''}${h(r.rotulo || (r.dias.length===7 ? 'Todos os dias' : listaDias(r.dias)))}: ${h(fonte(r))}</small>`).join('')}</td>`;
      for (let wd = 0; wd < 7; wd++) {
        const ri = e.pausada ? -1 : (e.regras||[]).findIndex(r => (r.dias||[]).includes(wd));

      }
      out += `</tr>`;
    });
    out += `</tbody></table></div>`;
  });
  const c = Object.assign({minSemana:3, prioridade:[], acidDias:14, detoxSemana:1}, sel.cabelo);
  out += `<h3 style="margin-top:6px">Cabelo</h3><div class="card small stack" style="gap:4px">

    ${c.nota ? `<div class="muted">${h(c.nota)}</div>` : ''}</div></section>`;
  out += `<section class="section"><div class="section-h"><h2>Backup dos dados</h2></div>
    <div class="card stack"><div class="small muted">Um arquivo .json com produtos, rotinas e histórico. Serve para guardar uma cópia ou passar os dados para outro aparelho.</div>

    <div id="imp-msg">${impMsg()}</div></div></section>`;
  return out;
}

/* ---------- VIEW: Histórico ---------- */
function statusDia(d){
  const reg = S.diario[d]; if (!reg) return null;
  const per = etapasDoDia(versaoPara(d), d);
  const r = {};
  per.forEach(p => { const n = p.etapas.length, f = p.etapas.filter(e => reg.pele && reg.pele[p.id+':'+e.id]).length; r[p.id] = !f ? 0 : f >= n ? 2 : 1; });
  r.cabelo = reg.cabelo ? reg.cabelo.tipo : null;
  r.extras = (reg.extras||[]).length;
  return r;
}
function vHistorico(){
  const [y,m] = S.mes.split('-').map(Number);
  const first = new Date(y, m-1, 1, 12), dias = new Date(y, m, 0).getDate();
  const off = first.getDay();
  let cells = DC.map(l => `<div class="hd">${l}</div>`).join('');
  for (let i = 0; i < off; i++) cells += `<div class="day out"></div>`;
  const resumo = {lav:0, cow:0, detox:0, acid:0, ext:{}, peleDias:0, manha:0, noite:0};
  for (let n = 1; n <= dias; n++) {
    const d = y+'-'+pad(m)+'-'+pad(n), s = statusDia(d), reg = S.diario[d];
    let mk = '';
    if (s) {
      if (s.manha) mk += `<i class="mk ${s.manha===2?'dd':'dp'}" title="Diurna"></i>`;
      if (s.noite) mk += `<i class="mk ${s.noite===2?'nd':'np'}" title="Noturna"></i>`;
      if (s.cabelo) mk += `<i class="mk ${s.cabelo==='cowash'?'hc':'hw'}" title="${s.cabelo}"></i>`;
      if (s.extras) mk += `<i class="mk ex" title="Extra"></i>`;
      if (s.manha === 2) resumo.manha++; if (s.noite === 2) resumo.noite++;
      if (reg.cabelo) { if (reg.cabelo.tipo === 'cowash') resumo.cow++; else resumo.lav++; if (reg.cabelo.detox) resumo.detox++; if (reg.cabelo.acid) resumo.acid++; }
      (reg.extras||[]).forEach(e => resumo.ext[e.tipo] = (resumo.ext[e.tipo]||0)+1);
    }
    cells += `<button class="day ${d===hoje()?'today':''}" data-act="hist-dia" data-d="${d}" aria-label="${fmtLongo(d)}"><span class="n">${n}</span><span class="marks">${mk}</span></button>`;
  }
  return `<section class="section" style="margin-top:0">
    <div class="card"><div class="daynav"><button class="iconbtn" data-act="mes" data-n="-1" aria-label="Mês anterior">‹</button><div class="lbl"><b style="text-transform:capitalize">${MESES[m-1]}</b><span>${y}</span></div><button class="iconbtn" data-act="mes" data-n="1" aria-label="Próximo mês">›</button></div></div>
    <div class="cal">${cells}</div>
    <div class="legend"><span><i class="mk dd"></i>Diurna completa</span><span><i class="mk nd"></i>Noturna completa</span><span><i class="mk dp"></i>parcial</span><span><i class="mk hw"></i>Lavagem</span><span><i class="mk hc"></i>Cowash</span><span><i class="mk ex"></i>Extra</span></div>
    <div class="small muted">Toque num dia para ver ou corrigir o que foi feito.</div>
    <h3>Resumo do mês</h3>
    <div class="sum">
      <div class="metric"><span>Diurnas completas</span><b class="mono">${resumo.manha}</b></div>
      <div class="metric"><span>Noturnas completas</span><b class="mono">${resumo.noite}</b></div>
      <div class="metric"><span>Lavagens</span><b class="mono">${resumo.lav}${resumo.cow ? ' + '+resumo.cow+' cowash' : ''}</b></div>
      <div class="metric"><span>Detox · acidificação</span><b class="mono">${resumo.detox} · ${resumo.acid}</b></div>
      ${Object.entries(resumo.ext).map(([k,v]) => `<div class="metric"><span>${h(k)}</span><b class="mono">${v}</b></div>`).join('')}
    </div></section>`;
}

  },
  'ed-cat-add': t => { const {pi,ei,ri} = t.dataset; const v = val(`ed-${pi}-${ei}-${ri}-cat`).trim(); if (!v) return; const r = S.ed.periodos[+pi].etapas[+ei].regras[+ri]; if (!r.cats.includes(v)) r.cats.push(v); renderEditor(); },
  'ed-cat-del': t => { const {pi,ei,ri,ci} = t.dataset; S.ed.periodos[+pi].etapas[+ei].regras[+ri].cats.splice(+ci, 1); renderEditor(); },
  'ed-hday': t => { const c = S.ed.cabelo, wd = +t.dataset.wd; c.prioridade = c.prioridade.includes(wd) ? c.prioridade.filter(x => x !== wd) : [...c.prioridade, wd].sort(); renderEditor(); },
  'ed-save': () => {
    const ed = S.ed, msg = document.getElementById('ed-msg');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(ed.inicio || '')) { msg.innerHTML = '<div class="banner bad">Escolha a data de início.</div>'; return; }
    if (S.edTemp && !(/^\d{4}-\d{2}-\d{2}$/.test(ed.fim || '') && ed.fim >= ed.inicio)) { msg.innerHTML = '<div class="banner bad">A data final precisa ser igual ou depois da data inicial.</div>'; return; }
    const clash = !S.edTemp && versoes().find(v => v.inicio === ed.inicio && v.id !== ed.id);
    if (clash) { msg.innerHTML = `<div class="banner bad">Já existe a versão "${h(clash.nome)}" começando em ${fmtCurto(ed.inicio)}. Escolha outra data ou edite aquela.</div>`; return; }
    const id = ed.id; const body = clone(ed); delete body.id;
    body.nome = (body.nome || '').trim() || (S.edTemp ? 'Ajuste de '+fmtCurto(body.inicio) : 'Rotina de '+fmtCurto(body.inicio));
    if (!S.edTemp) delete body.fim;
    body.atualizadoEm = hoje();
    Store.write('rotinas', id, body); S.verSel = id; closeModal();
    toast(S.edTemp ? 'Ajuste vale de '+fmtCurto(body.inicio)+' a '+fmtCurto(body.fim) : S.edNova ? 'Nova versão vale a partir de '+fmtCurto(body.inicio) : 'Versão atualizada');
  },
  close: () => closeModal(),
  exportar: async () => {
    const dados = {app:'necessaire', versao:1, exportadoEm:new Date().toISOString(), produtos:S.produtos, rotinas:S.rotinas, diario:S.diario, config:S.config};
    const nome = 'necessaire-backup-'+hoje()+'.json', txt = JSON.stringify(dados, null, 1);
    let dl = null;
    try { dl = (window.claude && window.claude.use) ? await window.claude.use('downloads') : null; } catch(e) {}
    if (dl) { try { await dl.save({filename:nome, data:txt}); toast('Backup salvo'); } catch(e) { if (e && e.code !== 'declined') toast('Não foi possível salvar o backup aqui.'); } return; }
    const url = URL.createObjectURL(new Blob([txt], {type:'application/json'}));
    const a = document.createElement('a'); a.href = url; a.download = nome; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  },
  'importar-ok': () => {
    const j = S.importando; if (!j) return;
    ['produtos','rotinas','diario','config'].forEach(col => {
      const novo = j[col] || {};
      Object.keys(S[col]).forEach(id => { if (!(id in novo)) Store.write(col, id, null); });
      Object.entries(novo).forEach(([id,doc]) => Store.write(col, id, doc));
    });
    S.importando = null; document.getElementById('imp-msg').innerHTML = ''; toast('Backup importado');
  },
  'importar-cancel': () => { S.importando = null; document.getElementById('imp-msg').innerHTML = ''; },
  'hist-dia': t => { S.dia = t.dataset.d; location.hash = 'hoje'; },
  mes: t => { const [y,m] = S.mes.split('-').map(Number); const d = new Date(y, m-1 + +t.dataset.n, 1, 12); S.mes = d.getFullYear()+'-'+pad(d.getMonth()+1); render(); }
};
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act]'); if (!t) return;
  if (t.dataset.act === 'backdrop') { if (ev.target === t) closeModal(); return; }
  if (t.dataset.confirm && !t.classList.contains('armed')) {
    t.classList.add('armed'); const old = t.textContent; t.textContent = t.dataset.confirm;
    setTimeout(() => { t.classList.remove('armed'); t.textContent = old; }, 4000); return;
  }
  const fn = A[t.dataset.act]; if (fn) fn(t, ev);
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'busca') { S.busca = t.value; const pl = document.getElementById('plist'); if (pl) pl.innerHTML = listaProdutos(); return; }
  if (t.dataset && t.dataset.ed && S.ed) {
    let v = t.value;
    if ('num' in t.dataset) v = Math.max(0, parseInt(v, 10) || 0);
    if ('bool' in t.dataset) v = t.checked;
    setPath(S.ed, t.dataset.ed, v);
  }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset && 'bool' in t.dataset && S.ed) setPath(S.ed, t.dataset.ed, t.checked);
  if (t.dataset && 'rr' in t.dataset && S.ed) { setPath(S.ed, t.dataset.ed, t.value); renderEditor(); }
  if (t.id === 'imp-file' && t.files && t.files[0]) {
    const fr = new FileReader();
    fr.onload = () => {
      const msg = document.getElementById('imp-msg');
      try {
        const j = JSON.parse(fr.result);
        if (j.app !== 'necessaire' || !j.produtos || !j.rotinas) throw new Error('formato');
        S.importando = j;
        msg.innerHTML = impMsg();
      } catch(e) { msg.innerHTML = '<div class="banner bad">Este arquivo não é um backup do Nécessaire.</div>'; }
      t.value = '';
    };
    fr.readAsText(t.files[0]);
  }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && $('#modal').firstChild) closeModal(); });
function route(){ const k = (location.hash || '#hoje').slice(1); S.view = VIEWS.some(v => v[0] === k) ? k : 'hoje'; closeModal(); render(); window.scrollTo(0,0); }
window.addEventListener('hashchange', route);
S.view = VIEWS.some(v => v[0] === location.hash.slice(1)) ? location.hash.slice(1) : 'hoje';
renderNav();
Store.init();
})();
</script>

<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
