<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDF1EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nécessaire">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Nécessaire da Karine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: app de uma tela — cabeçalho, conteúdo rolável, abas embaixo; coluna central até 560px. Visual de prateleira de banheiro: porcelana fria + eucalipto, carimbos de validade em mono */
:root{
  --bg:#EDF1EF; --surface:#FFFFFF; --sunk:#E1E8E5; --ink:#16232A; --muted:#58686D; --line:#D2DBD7;
  --accent:#2C5E56; --accent-ink:#FFFFFF; --accent-soft:#D6E7E1;
  --bad:#B3261E; --bad-soft:#F7DFDC; --warn:#965800; --warn-soft:#F5E7CF; --good:#2B7449; --good-soft:#D9EEDF;
  --f-acido:#C27A17; --f-retinol:#7155C2; --f-hidrat:#2A7BAD; --f-argila:#8A684A; --f-hair:#A8721A; --f-manha:#2C5E56;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px; --shadow:0 1px 2px rgba(22,35,42,.06),0 4px 14px rgba(22,35,42,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F171A; --surface:#172227; --sunk:#1D2A2F; --ink:#E4EDEA; --muted:#97A8AC; --line:#2A3A40;
  --accent:#7CC0B3; --accent-ink:#0F171A; --accent-soft:#1E3633;
  --bad:#F08A80; --bad-soft:#3A1F1D; --warn:#E6AE5C; --warn-soft:#3A2D18; --good:#79C795; --good-soft:#1B3325;
  --f-acido:#E2A04A; --f-retinol:#A48BEA; --f-hidrat:#6CB2DE; --f-argila:#C09C7C; --f-hair:#D9A24C; --f-manha:#7CC0B3;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F171A; --surface:#172227; --sunk:#1D2A2F; --ink:#E4EDEA; --muted:#97A8AC; --line:#2A3A40;
  --accent:#7CC0B3; --accent-ink:#0F171A; --accent-soft:#1E3633;
  --bad:#F08A80; --bad-soft:#3A1F1D; --warn:#E6AE5C; --warn-soft:#3A2D18; --good:#79C795; --good-soft:#1B3325;
  --f-acido:#E2A04A; --f-retinol:#A48BEA; --f-hidrat:#6CB2DE; --f-argila:#C09C7C; --f-hair:#D9A24C; --f-manha:#7CC0B3;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:14px 10px}
.eyebrow{font:600 11px/1.2 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
h1{font:700 30px/1 var(--display);margin:0;letter-spacing:-.015em}
h2{font:700 21px/1.15 var(--display);margin:0;text-wrap:balance}
h3{font:600 17px/1.2 var(--display);margin:0}
.alert{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--bad-soft);color:var(--bad);font-weight:600;font-size:12.5px;white-space:nowrap}
.alert::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
main{flex:1;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:14px;padding-block:2px 18px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
main>*{flex-shrink:0}
nav.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding-block:6px 8px;border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;color:var(--muted);font-size:12px;font-weight:600}
.tab svg{width:22px;height:22px}
.tab[aria-current="true"]{color:var(--accent);background:var(--accent-soft)}

/* semana */
.week{display:grid;grid-template-columns:28px 1fr 28px;align-items:center;gap:4px}
.wkbtn{height:44px;border-radius:10px;color:var(--muted);font-size:20px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 7px;border-radius:12px;font-variant-numeric:tabular-nums}
.day .dl{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.day .dn{font:600 16px/1 var(--display)}
.day .dots{display:flex;gap:3px;height:6px}
.day .dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.day .dots i.hair{border-radius:50% 50% 50% 0;transform:rotate(-45deg)}
.day.today .dn{color:var(--accent)}
.day[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow)}
.day.full .dn{text-decoration:underline 2px var(--good);text-underline-offset:3px}

.dayhead{display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--sunk);font-size:12.5px;font-weight:600;color:var(--ink);border:1px solid transparent}
.chip.dot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,var(--accent))}
.chip.on{background:var(--surface);border-color:var(--c,var(--accent));color:var(--c,var(--accent));box-shadow:var(--shadow)}
.chips.sm .chip{padding:4px 9px;font-size:12px}

/* prateleira */
.shelf{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px 0}
.shelf-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.shelf-h span{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.shelf-row{display:flex;align-items:flex-end;gap:6px;overflow-x:auto;padding:12px 2px 0;border-bottom:3px solid var(--line);scrollbar-width:none;min-height:58px}
.shelf-row::-webkit-scrollbar{display:none}
.shelf-row .b{flex:none;display:flex;transition:opacity .2s,transform .2s}
.shelf-row .b.pend{opacity:.32}
.shelf-row .sep{flex:none;width:1px;height:28px;background:var(--line);margin:0 4px 4px}
.shelf-leg{display:flex;gap:12px;font-size:11.5px;color:var(--muted);padding:8px 0 10px;flex-wrap:wrap}

/* rotina */
.rot{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.rot-h{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.rot-h .ttl{flex:1;min-width:0}
.rot-h p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.ring{flex:none;width:38px;height:38px}
.ring .bgc{stroke:var(--sunk)} .ring .fg{stroke:var(--c,var(--accent));transition:stroke-dashoffset .3s}
.ring text{font:600 10.5px var(--body);fill:var(--ink)}
.allbtn{font-size:12.5px;font-weight:600;color:var(--accent);padding:6px 8px;border-radius:8px}
.seg2{display:inline-flex;background:var(--sunk);border-radius:999px;padding:2px;margin-top:6px}
.seg2 button{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;color:var(--muted)}
.seg2 button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.steps{list-style:none;margin:0;padding:4px 0}
.step{display:grid;grid-template-columns:40px 1fr;align-items:center;gap:4px;padding:4px 12px 4px 6px;position:relative}
.step+.step::before{content:"";position:absolute;left:25px;top:-8px;height:16px;border-left:2px dotted var(--line)}
.check{width:40px;height:40px;display:grid;place-items:center;border-radius:50%}
.check i{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;transition:background .15s,border-color .15s}
.check[aria-pressed="true"] i{background:var(--c,var(--accent));border-color:var(--c,var(--accent))}
.check[aria-pressed="true"] i::after{content:"";width:10px;height:5px;border-left:2px solid var(--surface);border-bottom:2px solid var(--surface);transform:translateY(-1px) rotate(-45deg)}
.check:disabled{opacity:.35;cursor:default}
.pick{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:10px;text-align:left;padding:7px 10px;border-radius:12px;min-width:0;border:1px solid transparent}
.pick:hover{background:var(--sunk)}
.pick .lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pick .nm{display:block;font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick .br{font-size:12.5px;color:var(--muted)}
.pick .mid{min-width:0}
.pick .chev{color:var(--muted);font-size:18px}
.pick.none .nm{color:var(--muted);font-weight:500;font-style:italic}
.pick.skip .nm{color:var(--muted);font-weight:500;text-decoration:line-through}
.step.done .nm{color:var(--muted)}
.flags{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.flag{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px}
.flag.bad{background:var(--bad-soft);color:var(--bad)} .flag.warn{background:var(--warn-soft);color:var(--warn)} .flag.info{background:var(--accent-soft);color:var(--accent)}
.ghostico{width:22px;height:30px;border:1.5px dashed var(--line);border-radius:5px;justify-self:center}
.nohair{padding:14px;border-radius:var(--r);border:1.5px dashed var(--line);color:var(--muted);font-size:13.5px}

/* estoque */
.segbar{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:12px;padding:3px}
.segbar button{padding:8px;border-radius:10px;font-weight:600;color:var(--muted)}
.segbar button b{font-variant-numeric:tabular-nums;font-weight:600;opacity:.7;margin-left:4px}
.segbar button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface);border-radius:12px;padding:10px 8px;text-align:left;box-shadow:var(--shadow);border:1.5px solid transparent;min-width:0}
.stat b{display:block;font:700 24px/1 var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted);font-weight:600}
.stat.bad b{color:var(--bad)} .stat.warn b{color:var(--warn)}
.stat[aria-pressed="true"]{border-color:var(--ink)}
.search{width:100%;box-sizing:border-box;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.group h4{margin:6px 2px 6px;font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.list{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.row{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:10px 12px 12px;width:100%;text-align:left;position:relative}
.row+.row{border-top:1px solid var(--line)}
.row .mid{min-width:0}
.row .nm{display:block;font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .br{font-size:12.5px;color:var(--muted)}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.stamp{font:500 11px/1 var(--mono);letter-spacing:.02em;padding:3px 5px;border-radius:4px;border:1px solid currentColor;font-style:normal;white-space:nowrap}
.st-ok .stamp{color:var(--muted)} .st-warn .stamp{color:var(--warn)} .st-bad .stamp{color:var(--bad)} .st-none .stamp{color:var(--muted);border-style:dashed}
.pill{font-size:11px;font-weight:600;color:var(--muted)}
.pill.uso{color:var(--accent)}
.meter{position:absolute;left:52px;right:12px;bottom:5px;height:3px;border-radius:2px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;border-radius:2px;background:var(--good)}
.st-warn .meter i{background:var(--warn)} .st-bad .meter i{background:var(--bad);width:100%!important;opacity:.5}
.fab{position:sticky;bottom:8px;align-self:flex-end;display:inline-flex;align-items:center;gap:8px;padding:12px 18px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.18);margin-top:auto}
.empty{color:var(--muted);text-align:center;padding:24px 8px;font-size:14px}

/* plano */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px}
.card p.sub{margin:0;color:var(--muted);font-size:13px}
.prow{display:grid;grid-template-columns:36px 1fr;gap:8px;align-items:start;padding:8px 0}
.prow+.prow{border-top:1px solid var(--line)}
.prow .pd{font:600 14px/28px var(--display)}
.prow .pcol{display:flex;flex-direction:column;gap:6px;min-width:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:10.5px;font-weight:600;color:var(--muted);text-transform:uppercase}
.cal button{padding:5px 0 6px;border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-variant-numeric:tabular-nums;font-size:13px}
.cal button.today{background:var(--accent-soft)}
.cal .m{display:flex;gap:2px}
.cal .m i{width:5px;height:5px;border-radius:50%;border:1px solid var(--c);box-sizing:border-box}
.cal .m i.f{background:var(--c)}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:6px;padding:11px 16px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
textarea{width:100%;box-sizing:border-box;min-height:90px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:12px/1.4 var(--mono);padding:8px}

/* folha inferior */
#ov{position:fixed;inset:0;background:rgba(10,18,20,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
#sheet{background:var(--bg);width:100%;max-width:560px;max-height:86%;overflow-y:auto;border-radius:20px 20px 0 0;box-sizing:border-box;padding-top:8px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transform:translateY(16px);transition:transform .2s ease}
#ov.show #sheet{transform:none}
#sheet::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.x{width:36px;height:36px;border-radius:50%;background:var(--sunk);font-size:20px;line-height:1;flex:none}
.hint{font-size:13px;color:var(--muted);margin:-4px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pc{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;background:var(--surface);border-radius:12px;padding:10px;border:2px solid transparent;box-shadow:var(--shadow);min-width:0}
.pc .nm{font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc .br{font-size:12px;color:var(--muted)}
.pc .tg{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;align-items:center}
.pc.on{border-color:var(--accent)}
.pc.st-bad{opacity:.62}
.tagx{font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:999px;background:var(--sunk);color:var(--muted);font-style:normal}
.tagx.rec{background:var(--accent-soft);color:var(--accent)}
.sh-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 12px}
.facts div{background:var(--surface);border-radius:10px;padding:9px 10px;display:flex;flex-direction:column;gap:2px}
.facts span{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.facts b{font-weight:600}
.facts em{font-style:normal;font-size:12.5px;color:var(--muted)}
form{display:flex;flex-direction:column;gap:10px}
label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted);min-width:0}
label input,label select{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:15px;font-weight:500;min-width:0;width:100%;box-sizing:border-box}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{font-size:12px;color:var(--muted);font-weight:500;margin:0}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,-10px);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:13.5px;font-weight:600;max-width:min(90vw,480px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<div id="app">
  <header class="top" id="top"></header>
  <main id="main"></main>
  <nav class="tabs" id="tabs" aria-label="Seções">
    <button class="tab" data-act="tab" data-t="hoje"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="10" r="4"/><path d="M9 2v1.5M9 16.5V18M2 10h1.5M14.5 10H16M4 5l1 1M13 14l1 1M4 15l1-1M13 6l1-1"/><path d="M20 15.5a4.5 4.5 0 0 1-6.3 4.1 4.5 4.5 0 0 0 3.6-6.6A4.5 4.5 0 0 1 20 15.5z"/></svg>Hoje</button>
    <button class="tab" data-act="tab" data-t="estoque"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 20h18M3 11h18"/><rect x="5" y="4" width="4" height="7" rx="1"/><rect x="11" y="6" width="3" height="5" rx="1"/><rect x="16" y="3" width="3" height="8" rx="1"/><rect x="5" y="14" width="5" height="6" rx="1.5"/><rect x="13" y="13" width="3" height="7" rx="1"/></svg>Estoque</button>
    <button class="tab" data-act="tab" data-t="plano"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><circle cx="8" cy="15" r="1"/><circle cx="12" cy="15" r="1"/><circle cx="16" cy="15" r="1"/></svg>Plano</button>
  </nav>
</div>
<div id="ov" hidden><div id="sheet" role="dialog" aria-modal="true"></div></div>

function etapas(r, s){
  if (r === 'manha') return ['limp2','locao','olhos','hidrat','fps', ...((getR(s,r).mode || 'presencial') === 'presencial' ? ['cushion'] : []), 'labios'];
  if (r === 'noite'){

    if (f === 'argila' || f === 'hidrat') e.push('mascara');

    if (f === 'hidrat' || f === 'argila') e.push('sleep');

  }
  const h = cabelo(s);

function recom(p, r, e, s){
  if (r === 'noite'){ const f = foco(s);
    if (e === 'trat') return (f === 'acido' && p.ativo === 'acido') || (f === 'retinol' && p.ativo === 'retinoide');
    if (e === 'olhos' && f === 'retinol') return p.ativo === 'retinoide'; }
  if (r === 'cabelo' && e === 'booster' && cabelo(s) === 'tratamento') return norm(p.nome).includes(CICLOK[cicloIdx(s)]);
  return false;
}

    if (part.length) bottles.push(part.join(''));
  }
  const shelf = `<section class="shelf" aria-label="Produtos escolhidos para o dia"><div class="shelf-h"><h3>Na pia hoje</h3><span>${feitos} de ${tot} aplicados</span></div>
    <div class="shelf-row">${bottles.join('<span class="sep"></span>') || '<span class="empty">Nada planejado</span>'}</div>
    <div class="shelf-leg"><span>Cheio = aplicado</span><span>Claro = falta aplicar</span><span>Toque no produto da etapa para trocar</span></div></section>`;

  const cards = rotinasDo(s).map(r => vRot(r, s)).join('');
  return `<section class="week"><button class="wkbtn" data-act="wk" data-n="-7" aria-label="Semana anterior">‹</button><div class="days">${days}</div><button class="wkbtn" data-act="wk" data-n="7" aria-label="Próxima semana">›</button></section>
    ${head}${shelf}${cards}
    ${!cabelo(s) ? `<div class="nohair">Cabelo não está planejado para ${DIASL[wd(s)].toLowerCase()}. Ajuste os dias de lavagem na aba Plano.</div>` : ''}`;
}

function vRot(r, s){
  const R = getR(s,r), [d, t] = prog(r,s), c = corRot(r,s);
  const C = 2*Math.PI*15, off = t ? C*(1 - d/t) : C;
  const sub = r === 'manha' ? 'Limpeza leve, hidratação e protetor'
    : r === 'noite' ? `Foco: ${FOCO[foco(s)][0].toLowerCase()}`
    : cabelo(s) === 'tratamento' ? `Cronograma: ${CICLO[cicloIdx(s)].toLowerCase()}` : 'Lavagem simples';
  const mode = r === 'manha' ? `<div class="seg2" role="group" aria-label="Onde vai passar o dia">
      <button data-act="mode" data-m="presencial" aria-pressed="${(R.mode||'presencial')==='presencial'}">Presencial</button>
      <button data-act="mode" data-m="casa" aria-pressed="${R.mode==='casa'}">Em casa</button></div>` : '';
  const steps = etapas(r,s).map(e => {
    const p = escolha(r,e,s), done = !!(R.done && R.done[e]);
    if (p === null){
      const temVencido = S.produtos.some(x => x.etapa === e && naPrateleira(x));
      return `<li class="step"><button class="check" disabled aria-label="Sem produto"><i></i></button>
        <button class="pick none" data-act="pick" data-r="${r}" data-e="${e}"><span class="ghostico"></span><span class="mid"><span class="lbl">${ETAPAS[e]}</span><span class="nm">${temVencido ? 'Só há itens vencidos' : 'Nada em estoque'}</span></span><span class="chev">›</span></button></li>`;
    }
    if (p === 'skip'){
      return `<li class="step"><button class="check" disabled aria-label="Etapa pulada"><i></i></button>
        <button class="pick skip" data-act="pick" data-r="${r}" data-e="${e}"><span class="ghostico"></span><span class="mid"><span class="lbl">${ETAPAS[e]}</span><span class="nm">Pulada hoje</span></span><span class="chev">›</span></button></li>`;
    }
    const fl = alertas(p,r,e,s).map(([k,txt]) => `<span class="flag ${k}">${esc(txt)}</span>`).join('');
    return `<li class="step ${done?'done':''}" style="--c:var(${c})"><button class="check" data-act="done" data-r="${r}" data-e="${e}" aria-pressed="${done}" aria-label="Marcar ${ETAPAS[e]} como feito"><i></i></button>
      <button class="pick" data-act="pick" data-r="${r}" data-e="${e}">${ico(p,30)}<span class="mid"><span class="lbl">${ETAPAS[e]}</span><span class="nm">${esc(p.nome)}</span><span class="br">${esc(p.marca)}</span>${fl ? `<span class="flags">${fl}</span>` : ''}</span><span class="chev">›</span></button></li>`;
  }).join('');
  return `<article class="rot" style="--c:var(${c})"><div class="rot-h">
      <svg class="ring" viewBox="0 0 38 38" aria-hidden="true"><circle class="bgc" cx="19" cy="19" r="15" fill="none" stroke-width="4"/><circle class="fg" cx="19" cy="19" r="15" fill="none" stroke-width="4" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 19 19)"/><text x="19" y="22.5" text-anchor="middle">${d}/${t}</text></svg>
      <div class="ttl"><h3>${ROT[r]}</h3><p>${sub}</p>${mode}</div>
      <button class="allbtn" data-act="all" data-r="${r}">${t && d === t ? 'Desfazer' : 'Concluir tudo'}</button></div>
    <ol class="steps">${steps}</ol></article>`;
}

function vEstoque(){
  const em = S.produtos.filter(naPrateleira), rep = S.produtos.filter(p => p.status === 'acabou');
  const seg = `<div class="segbar" role="group"><button data-act="seg" data-s="estoque" aria-pressed="${ui.seg==='estoque'}">Na prateleira<b>${em.length}</b></button><button data-act="seg" data-s="repor" aria-pressed="${ui.seg==='repor'}">Repor<b>${rep.length}</b></button></div>`;
  if (ui.seg === 'repor'){
    const rows = rep.map(p => `<div class="row st-none" style="grid-template-columns:30px 1fr auto">${ico(p)}<span class="mid"><span class="nm">${esc(p.nome)}</span><span class="br">${esc(p.marca)} · ${esc(p.tipo)}</span></span>
      <span class="side"><button class="btn" style="padding:7px 12px;font-size:13px" data-act="comprei" data-pid="${p.id}">Comprei</button><button class="pill" data-act="del" data-pid="${p.id}">Remover</button></span></div>`).join('');
    return seg + (rows ? `<div class="list">${rows}</div><p class="note">“Comprei” devolve o item à prateleira e pede a nova validade.</p>` : `<p class="empty">Nada para repor. Quando um produto acabar, ele aparece aqui como lista de compras.</p>`);
  }
  const n = k => em.filter(p => k === 'bad' || k === 'warn' ? est(p) === k : p.status === k).length;
  const stats = `<div class="stats">${[['bad','Vencidos'],['warn','Até 60 dias'],['uso','Em uso'],['fechado','Fechados']].map(([k,l]) =>
    `<button class="stat ${k}" data-act="filtro" data-k="${k}" aria-pressed="${ui.filtro===k}"><b>${n(k)}</b><span>${l}</span></button>`).join('')}</div>`;
  const regs = `<div class="chips">${['Todos','Rosto','Cabelo','Corpo','Unhas'].map(x => `<button class="chip ${ui.regiao===x?'on':''}" data-act="regiao" data-k="${x}">${x}</button>`).join('')}</div>`;
  return seg + stats + regs + `<input class="search" id="q" type="search" placeholder="Buscar por nome, marca ou tipo" value="${esc(ui.q)}" autocomplete="off">
    <div id="list">${vLista()}</div><button class="fab" data-act="add">+ Produto</button>`;
}
function vLista(){
  const q = norm(ui.q);
  const ps = S.produtos.filter(p => naPrateleira(p)
    && (ui.regiao === 'Todos' || p.regiao === ui.regiao)
    && (!ui.filtro || (ui.filtro === 'bad' || ui.filtro === 'warn' ? est(p) === ui.filtro : p.status === ui.filtro))
    && (!q || norm(p.nome+' '+p.marca+' '+p.tipo).includes(q)));
  if (!ps.length) return `<p class="empty">Nenhum produto com esses filtros.</p>`;
  const groups = new Map();
  for (const p of ps){ const k = (ui.regiao === 'Todos' ? p.regiao + ' · ' : '') + p.tipo; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(p); }
  return [...groups].map(([k, arr]) => {
    arr.sort((a,b) => (dias(a) ?? 9e9) - (dias(b) ?? 9e9));
    return `<section class="group"><h4><span>${esc(k)}</span><span>${arr.length}</span></h4><div class="list">${arr.map(p => {
      const d = dias(p), pct = d === null ? 0 : Math.max(4, Math.min(100, d/730*100));
      return `<button class="row st-${est(p)}" data-act="item" data-pid="${p.id}">${ico(p)}<span class="mid"><span class="nm">${esc(p.nome)}</span><span class="br">${esc(p.marca)}${p.qtd>1?` · ${p.qtd} unidades`:''}${p.ativo?` · ${ATIVO[p.ativo]}`:''}</span></span>
        <span class="side"><i class="stamp">${stamp(p)}</i><span class="pill ${p.status}">${p.status==='uso'?'Em uso':'Fechado'}</span></span><span class="meter"><i style="width:${pct}%"></i></span></button>`;
    }).join('')}</div></section>`;
  }).join('');
}

function vPlano(){
  const semana = DIAS.map((dn, i) => `<div class="prow"><span class="pd">${dn}</span><div class="pcol">
      <div class="chips sm">${Object.entries(FOCO).map(([k,[n,c]]) => `<button class="chip ${S.plano.noite[i]===k?'on':''}" style="--c:var(${c})" data-act="setfoco" data-i="${i}" data-k="${k}">${n}</button>`).join('')}</div>
      <div class="chips sm">${[['','Sem cabelo'],['lavagem','Lavar'],['tratamento','Tratamento']].map(([k,n]) => `<button class="chip ${(S.plano.cabelo[i]||'')===k?'on':''}" style="--c:var(--f-hair)" data-act="setcab" data-i="${i}" data-k="${k}">${n}</button>`).join('')}</div>
    </div></div>`).join('');
  const ci = cicloIdx(TODAY);
  const ciclo = `<div class="card"><h3>Cronograma capilar</h3><p class="sub">Nos dias de tratamento o booster segue um ciclo de 3 semanas. Toque na etapa desta semana para alinhar o ciclo.</p>
    <div class="chips">${CICLO.map((n,k) => `<button class="chip dot ${k===ci?'on':''}" style="--c:var(--f-hair)" data-act="setciclo" data-k="${k}">${k===ci?'Esta semana: ':''}${n}</button>`).join('')}</div></div>`;

  const d = parse(ui.date), y = d.getFullYear(), m = d.getMonth(), first = new Date(y, m, 1), nd = new Date(y, m+1, 0).getDate();
  let cells = DIAS.map(x => `<span class="h">${x[0]}</span>`).join('') + '<span></span>'.repeat(first.getDay());
  for (let i = 1; i <= nd; i++){
    const x = ymd(new Date(y, m, i));
    const marks = rotinasDo(x).map(r => { const [a,b] = prog(r,x); const done = getR(x,r).done && Object.keys(getR(x,r).done).length;
      return `<i class="${b && a===b && done ? 'f' : ''}" style="--c:var(${corRot(r,x)})"></i>`; }).join('');
    cells += `<button class="${x===TODAY?'today':''}" data-act="goday" data-date="${x}">${i}<span class="m">${marks}</span></button>`;
  }
  const cal = `<div class="card"><div class="shelf-h"><h3>${MESES[m][0].toUpperCase()+MESES[m].slice(1)} ${y}</h3><span class="btnrow"><button class="allbtn" data-act="mes" data-n="-1" aria-label="Mês anterior">‹</button><button class="allbtn" data-act="mes" data-n="1" aria-label="Próximo mês">›</button></span></div>
    <p class="sub">Bolinha cheia: rotina concluída. Vazia: planejada. Toque num dia para abrir.</p><div class="cal">${cells}</div></div>`;

  const dados = `<div class="card"><h3>Dados</h3><p class="sub">Tudo fica salvo neste aparelho. Copie um backup de vez em quando ou para levar a outro celular.</p>
    <div class="btnrow"><button class="btn ghost" data-act="export">Copiar backup</button><button class="btn ghost" data-act="importOpen">Restaurar backup</button><button class="btn danger" data-act="reset">Recarregar da planilha</button></div></div>`;
  return `<div class="card"><h3>Semana padrão</h3><p class="sub">Linha de cima: foco da noite (sua legenda da planilha). Linha de baixo: cabelo.</p>${semana}</div>${ciclo}${cal}${dados}`;
}

/* ---------- folhas ---------- */
function sheet(html){ $('#sheet').innerHTML = html; const o = $('#ov'); o.hidden = false; requestAnimationFrame(() => o.classList.add('show')); }
function closeSheet(){ const o = $('#ov'); o.classList.remove('show'); o.hidden = true; }
const head = (eb, t) => `<div class="sh-head"><div><p class="eyebrow">${eb}</p><h2>${t}</h2></div><button class="x" data-act="close" aria-label="Fechar">×</button></div>`;

function openChooser(r, e){
  const s = ui.date, c = cands(r,e,s), cur = escolha(r,e,s), f = foco(s);
  const hint = r === 'noite' && e === 'trat' ? `Noite de ${FOCO[f][0].toLowerCase()}: produtos indicados aparecem primeiro.`
    : r === 'cabelo' && e === 'booster' ? `Semana de ${CICLO[cicloIdx(s)].toLowerCase()} no cronograma.`
    : r === 'manha' ? 'Ativos (ácidos e retinoides) ficam no fim da lista de manhã.' : 'Ordem: indicados, depois o que vence primeiro.';
  const cards = c.map(p => `<button class="pc st-${est(p)} ${cur===p?'on':''}" data-act="choose" data-r="${r}" data-e="${e}" data-pid="${p.id}">${ico(p,40)}
      <span class="nm">${esc(p.nome)}</span><span class="br">${esc(p.marca)}</span>
      <span class="tg"><i class="stamp">${stamp(p)}</i>${recom(p,r,e,s)?'<i class="tagx rec">indicado</i>':''}${p.status==='fechado'?'<i class="tagx">fechado</i>':''}${est(p)==='bad'?'<i class="tagx">vencido</i>':''}</span></button>`).join('');
  sheet(head(`${ROT[r]} · ${DIASL[wd(s)]}`, ETAPAS[e]) + `<p class="hint">${hint}</p>` +
    (cards ? `<div class="grid">${cards}</div>` : `<p class="empty">Nenhum produto desta etapa no estoque.</p>`) +
    `<div class="sh-actions"><button class="btn ghost" data-act="skip" data-r="${r}" data-e="${e}">Pular hoje</button><button class="btn ghost" data-act="auto" data-r="${r}" data-e="${e}">Sugestão automática</button><button class="btn ghost" data-act="add" data-e="${e}">+ Novo produto</button></div>`);
}

function openItem(id){
  const p = byId(id); if (!p) return;
  sheet(`<div class="sh-head"><div style="display:flex;gap:12px;align-items:center">${ico(p,56)}<div><p class="eyebrow">${esc(p.regiao)} · ${esc(p.tipo)}</p><h2>${esc(p.nome)}</h2><p class="note">${esc(p.marca)}</p></div></div><button class="x" data-act="close" aria-label="Fechar">×</button></div>
    <div class="facts st-${est(p)}"><div><span>Validade</span><b><i class="stamp">${stamp(p)}</i></b><em>${prazo(p)}${porPAO(p)?' · pelo PAO':''}</em></div>
      <div><span>Status</span><b>${p.status==='uso'?'Em uso':'Fechado'}</b><em>${p.aberto?'aberto em '+fmtD(p.aberto):'data de abertura não registrada'}</em></div>
      <div><span>Unidades</span><b>${p.qtd}</b></div><div><span>Depois de aberto</span><b>${p.pao?p.pao+' meses':'—'}</b><em>${p.pao?'':'veja o potinho “12M” na embalagem'}</em></div></div>
    <div class="btnrow">${p.status==='fechado'?`<button class="btn" data-act="abrir" data-pid="${p.id}">Abri hoje</button>`:''}
      <button class="btn ${p.status==='fechado'?'ghost':''}" data-act="acabou" data-pid="${p.id}">${p.qtd>1?'Terminei uma unidade':'Acabou'}</button>
      <button class="btn ghost" data-act="mais" data-pid="${p.id}">+1 unidade</button><button class="btn ghost" data-act="edit" data-pid="${p.id}">Editar</button>
      <button class="btn danger" data-act="del" data-pid="${p.id}">Excluir</button></div>`);
}

function regiaoDe(e){ return Object.keys(REG_ETAPAS).find(k => REG_ETAPAS[k].includes(e)); }
function etapaOpts(reg, sel){ return (REG_ETAPAS[reg] || ['outro']).map(e => `<option value="${e}" ${e===sel?'selected':''}>${ETAPAS[e]}</option>`).join(''); }
function openForm(p, preset = {}){
  const novo = !p;
  p = p || { regiao: regiaoDe(preset.etapa) || (ui.regiao !== 'Todos' ? ui.regiao : 'Rosto'), etapa: preset.etapa || '', marca:'', nome:'', qtd:1, status:'fechado', validade:null, aberto:null, pao:'' };
  sheet(head(novo ? 'Novo produto' : 'Editar', novo ? 'Adicionar à prateleira' : esc(p.nome)) + `<form id="pform" data-id="${p.id||''}">
    <div class="two"><label>Região<select id="f-regiao" name="regiao">${Object.keys(REG_ETAPAS).map(k => `<option ${k===p.regiao?'selected':''}>${k}</option>`).join('')}</select></label>
    <label>Etapa na rotina<select id="f-etapa" name="etapa">${etapaOpts(p.regiao, p.etapa)}</select></label></div>
    <label>Marca<input id="f-marca" name="marca" required value="${esc(p.marca)}" autocomplete="off"></label>
    <label>Nome<input id="f-nome" name="nome" required value="${esc(p.nome)}" autocomplete="off"></label>
    <div class="two"><label>Validade (VAL/EXP)<input type="month" id="f-val" name="validade" value="${p.validade?p.validade.slice(0,7):''}"></label>
    <label>Depois de aberto<select id="f-pao" name="pao"><option value="">—</option>${[3,6,9,12,18,24,36].map(m => `<option value="${m}" ${Number(p.pao)===m?'selected':''}>${m} meses</option>`).join('')}</select></label></div>
    <p class="note">O potinho aberto com “6M”, “12M” na embalagem é o prazo depois de aberto. O app usa o que vencer primeiro.</p>
    <div class="two"><label>Unidades<input type="number" min="1" id="f-qtd" name="qtd" value="${Math.max(1,p.qtd||1)}"></label>
    <label>Status<select id="f-status" name="status"><option value="fechado" ${p.status==='fechado'?'selected':''}>Fechado</option><option value="uso" ${p.status==='uso'?'selected':''}>Em uso</option></select></label></div>
    <label>Aberto em<input type="date" id="f-ab" name="aberto" value="${p.aberto||''}"></label>
    <button class="btn" type="submit">${novo?'Adicionar':'Salvar'}</button></form>`);
}

/* ---------- ações ---------- */
let toastT;
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2800); }
function abrirSeFechado(p, s){ if (p && p !== 'skip' && p.status === 'fechado'){ p.status = 'uso'; p.aberto = s; return true; } return false; }
function armar(btn, fn){
  if (btn.dataset.armed){ fn(); return; }
  btn.dataset.armed = '1'; const old = btn.textContent; btn.textContent = 'Toque de novo para confirmar';
  setTimeout(() => { if (btn.isConnected){ delete btn.dataset.armed; btn.textContent = old; } }, 3000);
}
const ACT = {
  tab: d => { ui.tab = d.t; try { localStorage.setItem(KEY+'.tab', d.t); } catch(e) {} render(); $('#main').scrollTop = 0; },
  day: d => { ui.date = d.date; render(); },
  goday: d => { ui.date = d.date; ui.tab = 'hoje'; render(); $('#main').scrollTop = 0; },
  wk: d => { ui.date = addDays(ui.date, +d.n); render(); },
  mes: d => { const x = parse(ui.date); x.setDate(1); x.setMonth(x.getMonth() + +d.n); ui.date = ymd(x); render(); },
  mode: d => { setR(ui.date,'manha').mode = d.m; save(); render(); },
  pick: d => openChooser(d.r, d.e),
  choose: d => { setR(ui.date,d.r).sel[d.e] = d.pid; S.last[d.r+':'+d.e] = d.pid; save(); closeSheet(); render(); },
  skip: d => { setR(ui.date,d.r).sel[d.e] = 'skip'; save(); closeSheet(); render(); },
  auto: d => { delete setR(ui.date,d.r).sel[d.e]; save(); closeSheet(); render(); },
  done: d => {
    const R = setR(ui.date,d.r), p = escolha(d.r,d.e,ui.date);
    R.done[d.e] = !R.done[d.e]; if (!R.done[d.e]) delete R.done[d.e];
    if (R.done[d.e] && p && p !== 'skip'){ S.last[d.r+':'+d.e] = p.id; if (abrirSeFechado(p, ui.date)) toast(`${p.nome} marcado como aberto hoje`); }
    save(); render();
  },
  all: d => {
    const R = setR(ui.date,d.r), [a,b] = prog(d.r,ui.date);
    if (b && a === b){ R.done = {}; } else { let ab = 0;
      for (const e of etapas(d.r,ui.date)){ const p = escolha(d.r,e,ui.date); if (p && p !== 'skip'){ R.done[e] = true; S.last[d.r+':'+e] = p.id; if (abrirSeFechado(p, ui.date)) ab++; } }
      toast(`${ROT[d.r]} concluída${ab ? ` · ${ab} produto${ab>1?'s':''} aberto${ab>1?'s':''} hoje` : ''}`); }
    save(); render();
  },
  goVenc: () => { ui.tab = 'estoque'; ui.seg = 'estoque'; ui.filtro = 'bad'; ui.regiao = 'Todos'; ui.q = ''; render(); },
  seg: d => { ui.seg = d.s; render(); },
  filtro: d => { ui.filtro = ui.filtro === d.k ? null : d.k; render(); },
  regiao: d => { ui.regiao = d.k; render(); },
  item: d => openItem(d.pid),
  abrir: d => { const p = byId(d.pid); p.status = 'uso'; p.aberto = TODAY; save(); openItem(p.id); render(); toast('Aberto hoje'); },
  acabou: d => { const p = byId(d.pid);
    if (p.qtd > 1){ p.qtd--; p.status = 'fechado'; p.aberto = null; toast(`Restam ${p.qtd} · a próxima está fechada`); openItem(p.id); }
    else { p.qtd = 0; p.status = 'acabou'; p.aberto = null; closeSheet(); toast(`${p.nome} foi para Repor`); }
    save(); render(); },
  mais: d => { const p = byId(d.pid); p.qtd++; save(); openItem(p.id); render(); },
  edit: d => openForm(byId(d.pid)),
  add: d => openForm(null, { etapa: d.e }),
  comprei: d => { const p = byId(d.pid); p.qtd = 1; p.status = 'fechado'; p.aberto = null; p.validade = null; openForm(p); },
  del: (d, btn) => armar(btn, () => { S.produtos = S.produtos.filter(p => p.id !== d.pid); save(); closeSheet(); render(); toast('Produto excluído'); }),
  close: () => closeSheet(),
  setfoco: d => { S.plano.noite[+d.i] = d.k; save(); render(); },
  setcab: d => { S.plano.cabelo[+d.i] = d.k || null; save(); render(); },
  setciclo: d => { S.plano.anchor = addDays(domingo(TODAY), -7 * +d.k); save(); render(); },
  export: () => { const txt = JSON.stringify(S);
    const fallback = () => { sheet(head('Backup','Copie o texto abaixo') + `<textarea id="bk" readonly>${esc(txt)}</textarea>`); const t = $('#bk'); t.focus(); t.select(); };
    try { navigator.clipboard.writeText(txt).then(() => toast('Backup copiado'), fallback); } catch(e) { fallback(); } },
  importOpen: () => sheet(head('Backup','Restaurar') + `<form id="iform"><label>Cole aqui o texto do backup<textarea id="imp" required></textarea></label><button class="btn" type="submit">Restaurar</button></form>`),
  reset: (d, btn) => armar(btn, () => { S = fresh(); save(); render(); toast('Dados recarregados da planilha'); })
};

document.addEventListener('click', e => {
  if (e.target.id === 'ov'){ closeSheet(); return; }
  const t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  const f = ACT[t.dataset.act]; if (f){ e.preventDefault(); f(t.dataset, t); }
});
document.addEventListener('input', e => { if (e.target.id === 'q'){ ui.q = e.target.value; $('#list').innerHTML = vLista(); } });
document.addEventListener('change', e => { if (e.target.id === 'f-regiao') $('#f-etapa').innerHTML = etapaOpts(e.target.value, ''); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#ov').hidden) closeSheet(); });
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'iform'){
    try { const x = JSON.parse($('#imp').value); if (!Array.isArray(x.produtos)) throw 0; S = x; save(); closeSheet(); render(); toast('Backup restaurado'); }
    catch(err){ toast('Texto inválido. Cole o backup completo, do primeiro { ao último }.'); }
    return;
  }
  if (e.target.id !== 'pform') return;
  const fd = new FormData(e.target), id = e.target.dataset.id, old = id ? byId(id) : null;
  const etapa = fd.get('etapa'), val = fd.get('validade');
  const p = Object.assign(old || { id: 'p' + Date.now().toString(36), ativo: null }, {
    regiao: fd.get('regiao'), etapa, tipo: old && old.etapa === etapa ? old.tipo : ETAPAS[etapa],
    marca: fd.get('marca').trim(), nome: fd.get('nome').trim(), validade: val ? val + '-01' : null,
    pao: fd.get('pao') || null, qtd: Math.max(1, parseInt(fd.get('qtd'), 10) || 1), status: fd.get('status'),
    aberto: fd.get('aberto') || (fd.get('status') === 'uso' && !(old && old.aberto) ? TODAY : null)
  });
  const n = norm(p.nome); p.ativo = /retin/.test(n) ? 'retinoide' : /acido (latico|mandelico|glicolico|salicilico)|aha|bha/.test(n) ? 'acido' : /peroxido/.test(n) ? 'bpo' : (old ? old.ativo : null);
  if (!old) S.produtos.push(p);
  save(); closeSheet(); render(); toast(old ? 'Salvo' : 'Adicionado à prateleira');
});

function render(){
  $('#top').innerHTML = vTop();
  $('#main').innerHTML = ui.tab === 'hoje' ? vHoje() : ui.tab === 'estoque' ? vEstoque() : vPlano();
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-current', b.dataset.t === ui.tab));
}
render();
</script>
<script>if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));</script>
</body>
